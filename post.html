<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicación — Where to Buy</title><style>
:root{--ink:#1b201c;--muted:#727970;--green:#2f5d46;--line:#e7e9e2}*{box-sizing:border-box}body{margin:0;background:#f6f6f2;color:var(--ink);font:16px system-ui,Arial}.wrap{max-width:850px;margin:auto;padding:24px}.back{color:var(--green);font-weight:800;text-decoration:none}.article{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:22px 0}.cover{width:100%;max-height:520px;object-fit:contain;display:block}.gallery{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;margin:22px 0}.thumbs{display:flex;flex-direction:column;gap:8px}.thumb{width:70px;height:70px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:9px;cursor:pointer;padding:3px}.thumb.active{border:2px solid var(--green)}.heroImage{width:100%;height:min(520px,70vw);object-fit:contain;background:#fff;border-radius:14px;cursor:zoom-in}.galleryStage{text-align:center}@media(max-width:600px){.gallery{grid-template-columns:1fr}.thumbs{order:2;flex-direction:row;overflow-x:auto}.heroImage{height:75vw}.thumb{flex:0 0 65px;width:65px;height:65px}}.content{padding:clamp(20px,5vw,48px)}.tag{color:var(--green);font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:1px}h1{font-size:clamp(32px,6vw,52px);line-height:1.08;letter-spacing:-1.8px;margin:12px 0}.sub{font-size:20px;color:var(--muted)}.body{font-size:17px;line-height:1.8;white-space:pre-wrap}.block{margin:34px 0}.block h2{font-size:25px}.block p,.details{line-height:1.75;white-space:pre-wrap}.block img{width:100%;border-radius:14px;margin-top:12px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}.buy{background:#f0f4ed;padding:22px;border-radius:16px;margin-top:30px}.buy a{display:inline-block;background:var(--green);color:white;padding:12px 16px;border-radius:10px;margin:8px 8px 0 0;text-decoration:none;font-weight:800}.muted{color:var(--muted)}.tags{display:flex;gap:8px;flex-wrap:wrap}.tags span{background:#edf2e9;border-radius:20px;padding:6px 10px;font-size:12px}@media(max-width:600px){.wrap{padding:15px}.content{padding:22px}}
</style></head><body><main class="wrap"><a class="back" href="/">← Volver a Where to Buy</a><article class="article" id="article"><div class="content">Cargando publicación…</div></article></main><script>
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function galleryHtml(p,esc){let imgs=[...(Array.isArray(p.galleryImages)?p.galleryImages:Array.isArray(p.images)?p.images:[])];if(p.coverImage&&!imgs.includes(p.coverImage))imgs.unshift(p.coverImage);imgs=imgs.filter(x=>/^https:\/\//i.test(x));if(!imgs.length)return "";return '<div class="gallery"><div class="thumbs">'+imgs.map((src,i)=>'<img class="thumb '+(i===0?'active':'')+'" src="'+esc(src)+'" alt="Vista '+(i+1)+'" data-image="'+esc(src)+'" loading="lazy">').join('')+'</div><div class="galleryStage"><img id="heroImage" class="heroImage" src="'+esc(imgs[0])+'" alt="'+esc(p.title)+'" title="Tocá para ampliar"></div></div>'}\nfunction yt(url){try{let u=new URL(url);if(u.hostname.includes("youtu.be"))return "https://www.youtube.com/embed/"+u.pathname.slice(1);if(u.hostname.includes("youtube.com"))return "https://www.youtube.com/embed/"+(u.searchParams.get("v")||u.pathname.split("/").pop());}catch{}return ""}
(async()=>{try{let id=new URLSearchParams(location.search).get("id");let r=await fetch("/posts.json?v="+Date.now());let posts=await r.json();let p=posts.find(x=>x.id===id);if(!p){document.querySelector("#article").innerHTML='<div class="content"><h1>Publicación no encontrada</h1><a href="/">Volver al inicio</a></div>';return}document.title=p.title+" — Where to Buy";let html='<div class="content"><div class="tag">'+esc(p.category||p.type||"Publicación")+'</div><h1>'+esc(p.title)+'</h1>'+(p.subtitle?'<p class="sub">'+esc(p.subtitle)+'</p>':'')+galleryHtml(p,esc)+(p.excerpt?'<p class="sub">'+esc(p.excerpt)+'</p>':'')+(p.body?'<div class="body">'+esc(p.body)+'</div>':'');if(p.videoUrl){let embed=yt(p.videoUrl);html+=embed?'<div class="block"><iframe class="video" src="'+esc(embed)+'" allowfullscreen loading="lazy"></iframe></div>':'<p><a href="'+esc(p.videoUrl)+'">Ver video ↗</a></p>'}for(let s of p.sections||[]){html+='<section class="block">'+(s.heading?'<h2>'+esc(s.heading)+'</h2>':'')+(s.text?'<p>'+esc(s.text)+'</p>':'')+(s.image?'<img src="'+esc(s.image)+'" alt="">':'')+'</section>'}if(p.product&&(p.product.name||p.product.details||p.product.links?.length)){html+='<section class="buy"><h2>'+esc(p.product.name||"Dónde conseguirlo")+'</h2>'+(p.product.price?'<b>'+esc(p.product.price)+'</b>':'')+(p.product.details?'<p class="details">'+esc(p.product.details)+'</p>':'');for(let l of p.product.links||[])html+='<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label||"Ver tienda")+' ↗</a>';html+='</section>'}if(p.socialUrl)html+='<p class="muted"><a href="'+esc(p.socialUrl)+'" target="_blank" rel="noopener noreferrer">Ver publicación original ↗</a></p>';if(p.tags?.length)html+='<div class="tags">'+p.tags.map(t=>'<span>'+esc(t)+'</span>').join("")+'</div>';html+='</div>';document.querySelector("#article").innerHTML=html;document.querySelectorAll(".thumb").forEach(t=>t.addEventListener("click",()=>{document.querySelector("#heroImage").src=t.dataset.image;document.querySelectorAll(".thumb").forEach(x=>x.classList.toggle("active",x===t))}));document.querySelector("#heroImage")?.addEventListener("click",e=>window.open(e.currentTarget.src,"_blank","noopener"))}catch{document.querySelector("#article").textContent="No se pudo cargar la publicación."}})();
</script></body></html>
