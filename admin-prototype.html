<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where to Buy — Panel privado (prototipo)</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#1b201c;background:#f6f6f2}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:48px auto;padding:0 20px}.brand{font-size:22px;font-weight:900;letter-spacing:-1px}.brand em{color:#2f5d46;font-style:normal}.panel{background:white;border:1px solid #e7e9e2;border-radius:18px;padding:26px;margin-top:22px}h1{font-size:27px;letter-spacing:-1px;margin:0 0 8px}p{color:#727970;line-height:1.5}.note{background:#fff4df;border:1px solid #f0d8a8;border-radius:12px;padding:12px;font-size:13px;color:#6d5427;margin:18px 0}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,textarea,select{width:100%;border:1px solid #dfe4dc;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:75px;resize:vertical}.btn{background:#2f5d46;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:800;margin-top:18px;cursor:pointer}.secondary{background:#edf2e9;color:#2f5d46}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:540px){.grid{grid-template-columns:1fr}.wrap{margin:24px auto}}
</style></head>
<body><main class="wrap"><div class="brand">Where to <em>Buy</em></div>
<section class="panel"><h1>Panel privado</h1><p>Área de administración para cargar publicaciones y sus enlaces de compra.</p>
<div class="note"><strong>Prototipo en preparación.</strong> Este archivo todavía no tiene inicio de sesión ni guarda datos. No introducir contraseñas ni información privada aquí. Se añadirá protección real antes de publicarlo.</div>
<form onsubmit="event.preventDefault();alert('Prototipo visual: todavía no publica ni guarda.');">
<label>Enlace de la publicación (TikTok, Instagram, etc.)</label><input type="url" placeholder="https://..." required>
<label>Título / descripción breve</label><input placeholder="Ej. El gadget viral de la semana" required>
<div class="grid"><div><label>Categoría</label><select><option>Accesorios</option><option>Hogar</option><option>Tecnología</option><option>Moda</option><option>Belleza</option><option>Otros</option></select></div><div><label>Emoji o imagen (URL)</label><input placeholder="✨ o https://..."></div></div>
<label>Link de compra afiliado</label><input type="url" placeholder="https://..." required>
<label>Link alternativo de compra (opcional)</label><input type="url" placeholder="https://...">
<button class="btn" type="submit">Guardar publicación (demo)</button></form></section></main></body></html>
