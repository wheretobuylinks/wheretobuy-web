<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel editorial</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f1;color:#19231c;font:15px system-ui}.wrap{max-width:850px;margin:28px auto;padding:16px}.card{background:white;border:1px solid #e3e8e0;border-radius:16px;padding:22px;margin:14px 0}h1{margin:0}h2{font-size:18px}p,small{color:#68736a}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #dce3da;border-radius:9px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}button{border:0;background:#315d46;color:white;padding:13px 18px;border-radius:10px;font-weight:800;cursor:pointer}.light{background:#edf2eb;color:#315d46}.block{border-top:1px solid #e3e8e0;margin-top:15px;padding-top:12px}#result{display:none;background:#edf5e9;padding:12px;margin-top:12px;border-radius:9px}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style><main class="wrap"><p><a href="/">← Volver al sitio</a></p><h1>Panel editorial</h1><p>Creá posts, artículos, reseñas, guías, comparativas o publicaciones de productos.</p><form id="form"><div class="card"><div class="grid"><div><label>Clave privada</label><input id="password" type="password" required></div><div><label>Tipo de publicación</label><select id="type"><option value="article">Post / artículo</option><option value="product">Producto</option><option value="review">Reseña</option><option value="guide">Guía</option><option value="comparison">Comparativa</option><option value="news">Novedad</option></select></div><div><label>Categoría</label><input id="category" placeholder="Tecnología, belleza, hogar..."></div><div><label>Etiquetas (separadas por coma)</label><input id="tags" placeholder="viral, recomendado"></div><div class="wide"><label>Título *</label><input id="title" maxlength="180" required></div><div class="wide"><label>Subtítulo</label><input id="subtitle" maxlength="240"></div><div class="wide"><label>Resumen para la portada</label><textarea id="excerpt" maxlength="400"></textarea></div><div class="wide"><label>Imagen principal (URL https)</label><input id="coverImage" type="url" placeholder="https://..."></div><div class="wide"><label>Texto del post</label><textarea id="body" style="min-height:180px" placeholder="Escribí el artículo completo. Separá párrafos con una línea en blanco."></textarea></div></div></div>
<div class="card"><h2>Bloques adicionales</h2><p>Sumá secciones con subtítulo, texto e imagen.</p><div id="sections"></div><button type="button" class="light" id="add">+ Agregar bloque</button><label>Video (URL opcional)</label><input id="videoUrl" type="url" placeholder="https://youtube.com/..."><label>Enlace al post original de redes (opcional)</label><input id="socialUrl" type="url" placeholder="https://..."></div>
<div class="card"><h2>Ficha del producto (opcional)</h2><div class="grid"><div><label>Nombre del producto</label><input id="productName"></div><div><label>Precio / referencia</label><input id="price"></div><div class="wide"><label>Detalles y características</label><textarea id="productDetails"></textarea></div><div class="wide"><label>Tiendas (una por línea: Nombre | URL)</label><textarea id="links" placeholder="Tienda A | https://..."></textarea></div></div></div>
<div class="card"><button id="submit">Publicar en el sitio</button><div id="result" role="status"></div><small>La clave no se publica. Los enlaces de compra son opcionales.</small></div></form></main>
<script>
const $=id=>document.getElementById(id),sections=$("sections");function addBlock(){let d=document.createElement("div");d.className="block";d.innerHTML='<label>Subtítulo del bloque</label><input class="heading"><label>Texto</label><textarea class="copy"></textarea><label>Imagen (URL opcional)</label><input class="image" type="url"><button type="button" class="light remove">Quitar bloque</button>';d.querySelector(".remove").onclick=()=>d.remove();sections.append(d)}$("add").onclick=addBlock;addBlock();
$("form").onsubmit=async e=>{e.preventDefault();const btn=$("submit"),out=$("result");btn.disabled=true;btn.textContent="Guardando…";out.style.display="block";out.textContent="Enviando…";const links=$("links").value.split("\n").map(x=>{let i=x.indexOf("|");return i<0?null:{label:x.slice(0,i).trim(),url:x.slice(i+1).trim()}}).filter(x=>x&&x.label&&x.url);const post={type:$("type").value,category:$("category").value,tags:$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),title:$("title").value,subtitle:$("subtitle").value,excerpt:$("excerpt").value,coverImage:$("coverImage").value,body:$("body").value,sections:[...sections.children].map(d=>({heading:d.querySelector(".heading").value,text:d.querySelector(".copy").value,image:d.querySelector(".image").value})),videoUrl:$("videoUrl").value,socialUrl:$("socialUrl").value,product:{name:$("productName").value,price:$("price").value,details:$("productDetails").value,links}};try{let r=await fetch("https://where-to-buy-admin.trendinginaliexpress.workers.dev/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value,post})});let j=await r.json();out.textContent=j.message||j.error;if(r.ok){let pw=$("password").value;$("form").reset();$("password").value=pw;sections.innerHTML="";addBlock()}}catch{out.textContent="No se pudo conectar con el servidor."}finally{btn.disabled=false;btn.textContent="Publicar en el sitio"}};
</script></html>
